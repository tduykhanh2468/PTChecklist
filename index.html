<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ PT</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#e8590c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
  /* Thiết kế theo mẫu Sổ Tập PT: nền xám xanh, nhấn cam, tab dưới đáy, form trượt từ dưới lên */
  :root {
    --bg:#EDF0EE; --card:#FFFFFF; --surface-2:#F5F7F6; --text:#14201B; --muted:#5B6A63; --line:#D7DFDA;
    --brand:#DB4F16; --brand-d:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FBE4D8;
    --ok:#1B7A4B; --ok-soft:#DCF1E5; --warn:#9A5B00; --warn-soft:#FAEDD2; --bad:#B42318; --bad-soft:#FADFDB;
    --backdrop:rgba(14,22,19,.45); --shadow:0 1px 2px rgba(20,32,27,.06), 0 6px 18px rgba(20,32,27,.07);
    --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
    --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0E1412; --card:#172019; --surface-2:#1E2924; --text:#E6EEEA; --muted:#93A39B; --line:#2B3832;
      --brand:#FF7840; --brand-d:#FF9060; --accent-ink:#1C0C04; --accent-soft:#3A2014;
      --ok:#5CCB92; --ok-soft:#133020; --warn:#EDB14A; --warn-soft:#33260E; --bad:#FF8B7B; --bad-soft:#3B1A15;
      --backdrop:rgba(0,0,0,.6); --shadow:0 1px 0 rgba(255,255,255,.03);
      color-scheme:dark;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font-body); font-size:15px; line-height:1.45; background:var(--bg); color:var(--text); -webkit-tap-highlight-color:transparent; }
  :focus-visible { outline:2px solid var(--brand); outline-offset:2px; }

  header { background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px 10px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-family:var(--font-display); font-weight:700; font-size:26px; letter-spacing:.04em; text-transform:uppercase; line-height:1; }
  header h1 b { color:var(--brand); }
  .today { color:var(--muted); font-size:13px; }
  main { max-width:560px; margin:0 auto; padding:14px 16px 110px; }

  button { font:inherit; font-weight:600; border:1px solid transparent; border-radius:12px; padding:10px 16px; cursor:pointer; background:var(--brand); color:var(--accent-ink); }
  button:hover { filter:brightness(.95); }
  button.ghost { background:var(--card); color:var(--text); border-color:var(--line); }
  button.ghost:hover { background:var(--surface-2); filter:none; }
  button.danger { background:var(--bad-soft); color:var(--bad); }
  .sm { padding:5px 11px; font-size:13px; border-radius:10px; }
  .mv { display:flex; gap:4px; align-items:center; }

  .fab { position:fixed; right:16px; bottom:76px; z-index:6; height:54px; padding:0 22px; border-radius:27px; font-size:15px; box-shadow:0 6px 20px rgba(0,0,0,.18); }

  nav { position:fixed; left:0; right:0; bottom:0; z-index:7; display:grid; grid-template-columns:repeat(3,1fr); background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
  nav button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; height:60px; border:0; border-radius:0; padding:0; background:none; color:var(--muted); font-size:12px; font-weight:500; }
  nav button:hover { background:none; filter:none; }
  nav button.on { color:var(--brand); }
  nav svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  .toolbar { display:flex; gap:8px; margin-bottom:12px; }
  input, textarea, select { font:inherit; font-size:16px; width:100%; height:44px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); color:var(--text); }
  textarea { height:auto; min-height:76px; padding:10px 12px; resize:vertical; }
  input[type=search] { background:var(--card); border-radius:12px; }
  input[type=checkbox] { width:auto; height:auto; accent-color:var(--brand); }
  input[type=file] { height:auto; padding:8px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; margin:12px 0 5px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:14px; margin-bottom:10px; cursor:pointer; }
  .card:hover { border-color:var(--brand); }
  .card.static { cursor:default; } .card.static:hover { border-color:var(--line); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .name { font-weight:600; font-size:16px; }
  .muted { color:var(--muted); font-size:13px; margin-top:4px; }
  .badge { font-size:12px; font-weight:600; padding:3px 9px; border-radius:99px; white-space:nowrap; }
  .b-ok { background:var(--ok-soft); color:var(--ok); } .b-warn { background:var(--warn-soft); color:var(--warn); }
  .b-bad { background:var(--bad-soft); color:var(--bad); } .b-none { background:var(--surface-2); color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .empty { text-align:center; color:var(--muted); padding:28px 16px; border:1.5px dashed var(--line); border-radius:14px; }

  /* Form dạng bảng trượt từ dưới lên */
  dialog { border:0; border-radius:20px 20px 0 0; padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px)); width:100%; max-width:560px; margin:auto auto 0; background:var(--card); color:var(--text); max-height:92vh; animation:sheetUp .22s ease-out; }
  dialog::backdrop { background:var(--backdrop); }
  dialog::before { content:""; display:block; width:40px; height:4px; border-radius:2px; background:var(--line); margin:4px auto 12px; }
  @keyframes sheetUp { from { transform:translateY(24px); opacity:.6; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { dialog { animation:none; } }
  h2 { margin:0 0 8px; font-family:var(--font-display); font-weight:700; font-size:26px; letter-spacing:.02em; line-height:1.1; }
  h3 { margin:18px 0 0; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }
  .spacer { flex:1; }

  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { background:var(--card); color:var(--text); border:1px solid var(--line); padding:6px 12px; border-radius:99px; font-size:13px; font-weight:500; }
  .chip:hover { background:var(--surface-2); filter:none; }
  .chip.on { background:var(--brand); color:var(--accent-ink); border-color:var(--brand); }
  .tag { display:inline-block; font-size:12px; background:var(--surface-2); color:var(--muted); padding:2px 8px; border-radius:6px; margin:6px 4px 0 0; }

  .item { border-top:1px solid var(--line); padding:10px 0; }
  .mini { display:grid; grid-template-columns:repeat(auto-fit,minmax(72px,1fr)); gap:6px; margin-top:6px; }
  .mini label { margin:0 0 2px; font-size:11px; }
  .mini input { height:38px; padding:0 8px; font-variant-numeric:tabular-nums; }
  details { margin-top:12px; } summary { cursor:pointer; color:var(--brand); font-size:14px; font-weight:600; }
  table { border-collapse:collapse; font-size:13px; width:100%; }
  th, td { border-bottom:1px solid var(--line); padding:7px 6px; text-align:left; white-space:nowrap; font-variant-numeric:tabular-nums; }
  th { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }

  .view { display:none; } .view.on { display:block; }
  footer { max-width:560px; margin:0 auto; padding:0 16px 110px; display:flex; gap:8px; flex-wrap:wrap; }

  /* Cấu trúc theo từng khách */
  nav { grid-template-columns:repeat(2,1fr); }
  .row .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sched { color:var(--brand); font-weight:600; font-size:14px; white-space:nowrap; }
  .notice { background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:10px 12px; font-size:13px; font-weight:500; margin-bottom:12px; }
  .dayTag { background:var(--brand); color:var(--accent-ink); font-family:var(--font-display); font-weight:700; font-size:18px; border-radius:8px; padding:2px 10px; min-width:40px; text-align:center; }
  .dayTag.off { background:var(--surface-2); color:var(--muted); }
  .sname { flex:1; min-width:0; height:38px; font-weight:600; }
  .irow { display:grid; grid-template-columns:1fr 44px 60px 64px 28px; gap:6px; align-items:center; padding:6px 0; border-top:1px solid var(--line); }
  .irow.ihead { border-top:0; padding:0 0 2px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  .irow.ihead span:not(:first-child) { text-align:center; }
  .irow input { height:36px; padding:0 4px; text-align:center; font-variant-numeric:tabular-nums; }
  .iname { display:flex; align-items:center; gap:2px; min-width:0; font-size:14px; font-weight:500; line-height:1.25; }
  button.x { background:none; border:0; color:var(--muted); padding:4px 6px; font-size:16px; border-radius:8px; font-weight:400; }
  button.x:hover { background:var(--surface-2); filter:none; }
  .weeks { display:flex; gap:6px; flex-wrap:wrap; }
  .wkrow { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .wkrow .chip { margin:0; min-width:78px; display:flex; align-items:center; gap:6px; text-transform:none; letter-spacing:0; font-size:14px; color:var(--text); }
  .wkrow .chip.on { color:var(--accent-ink); }
  /* Bảng lịch tuần của khách */
  .wscroll { overflow-x:auto; }
  .wgrid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; }
  .irow2 { border-top:1px solid var(--line); padding:10px 0; }
  .itop { display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
  .itop .iname { font-size:15px; font-weight:600; line-height:1.3; padding-top:4px; }
  .itop .mv { flex-shrink:0; }
  .ifields { display:grid; grid-template-columns:1fr 1.3fr 1.6fr; gap:8px; margin-top:6px; }
  .ilbl { display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ifields input { height:40px; text-align:center; font-size:16px; font-variant-numeric:tabular-nums; }
  button.x { padding:8px 10px; }
  .row .name { white-space:normal; overflow:visible; }
  .wcell { padding:4px 2px 5px; }
  .wtime { font-size:12.5px; }
  .wcell { border:1px solid var(--line); border-radius:10px; background:var(--surface-2); padding:4px 3px 5px; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
  .wcell.on { background:var(--accent-soft); border-color:var(--brand); }
  .wcell.today { box-shadow:0 0 0 2px var(--brand) inset; }
  button.wday { width:100%; padding:3px 0; background:none; color:var(--muted); font-family:var(--font-display); font-weight:700; font-size:18px; border-radius:6px; line-height:1.1; }
  .wcell.on button.wday { color:var(--brand); }
  button.wday:hover { background:none; filter:none; opacity:.7; }
  .wempty { color:var(--muted); font-size:11px; padding:10px 0 12px; }
  .wtime { width:100%; height:30px; padding:0; text-align:center; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; background:var(--card); border-radius:8px; }
  .wsess { width:100%; height:26px; padding:0 2px; font-size:12px; text-align:center; text-align-last:center; background:var(--card); border-radius:8px; }
  .sched { white-space:normal; text-align:right; }
</style>
</head>
<body>
<header>
  <h1>Sổ tập <b>PT</b></h1>
  <div class="today" id="todayLbl"></div>
</header>
<nav>
  <button class="on" data-tab="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M17 14.6c2.4.2 4 1.8 4.5 4.4"/></svg>Khách hàng</button>
  <button data-tab="exercises"><svg viewBox="0 0 24 24"><path d="M2.5 12h2M19.5 12h2M6.5 8v8M17.5 8v8M4.5 9.5v5M19.5 9.5v5M6.5 12h11"/></svg>Thư viện bài tập</button>
</nav>
<button class="fab" id="btnAdd">+ Thêm khách</button>

<main>
  <div class="view on" id="view-clients">
    <div class="toolbar"><input id="search" type="search" placeholder="Tìm theo tên hoặc số điện thoại..."></div>
    <div id="list"></div>
  </div>

  <div class="view" id="view-exercises">
    <div class="toolbar"><input id="exSearch" type="search" placeholder="Tìm bài tập hoặc nhóm cơ..."></div>
    <div class="chips" id="exChips"></div>
    <div id="exList"></div>
  </div>

  <div class="view" id="view-client"></div>
</main>

<footer id="foot">
  <button class="ghost" id="btnExport">⬇ Sao lưu ra file</button>
  <button class="ghost" id="btnImport">⬆ Khôi phục từ file</button>
  <input type="file" id="fileImport" accept=".json" hidden>
  <button class="ghost" id="btnSeed">📚 Nạp thư viện bài tập mẫu</button>
  <button class="ghost" id="btnImpSheet">📥 Nhập khách từ Google Sheets</button>
</footer>

<!-- Hồ sơ khách + gói tập -->
<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Khách mới</h2>
    <h3>Thông tin khách</h3>
    <label>Họ tên *</label>
    <input id="f_name" required>
    <div class="grid2">
      <div><label>Số điện thoại</label><input id="f_phone" type="tel" inputmode="tel"></div>
      <div><label>Ngày sinh</label><input id="f_dob" type="date"></div>
    </div>
    <label>Mục tiêu tập luyện</label>
    <input id="f_goal" placeholder="VD: giảm mỡ, tăng cơ, phục hồi lưng...">
    <label>Sức khỏe / chấn thương / lưu ý</label>
    <textarea id="f_health"></textarea>
    <h3>Gói tập</h3>
    <label>Tên gói</label>
    <input id="f_pkgName" placeholder="VD: Gói 24 buổi / 3 tháng">
    <div class="grid2">
      <div><label>Tổng số buổi</label><input id="f_pkgTotal" type="number" min="0" inputmode="numeric"></div>
      <div><label>Giá (VNĐ)</label><input id="f_pkgPrice" type="number" min="0" inputmode="numeric"></div>
      <div><label>Ngày bắt đầu</label><input id="f_pkgStart" type="date"></div>
      <div><label>Ngày hết hạn</label><input id="f_pkgEnd" type="date"></div>
    </div>
    <label>Ghi chú gói (đã thanh toán chưa, ưu đãi...)</label>
    <textarea id="f_pkgNote"></textarea>
    <div class="actions">
      <button type="button" class="danger" id="btnDelete">Xóa khách</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="btnCancel">Hủy</button>
      <button type="submit">Lưu</button>
    </div>
  </form>
</dialog>

<!-- Bài tập trong thư viện -->
<dialog id="exDlg">
  <form id="exForm" method="dialog">
    <h2 id="exTitle">Bài tập mới</h2>
    <label>Tên bài *</label>
    <input id="e_name" required placeholder="VD: Pendulum Squat">
    <div class="grid2">
      <div><label>Nhóm cơ chính</label><select id="e_group"></select></div>
      <div><label>Chuyển động</label><select id="e_pattern"></select></div>
    </div>
    <label>Cơ phụ / ghi chú nhóm cơ</label>
    <input id="e_muscle" placeholder="VD: Đùi trước + mông">
    <label>Các biến thể (mỗi dòng một biến thể)</label>
    <textarea id="e_vars" placeholder="Barbell&#10;Dumbbell&#10;Smith Machine"></textarea>
    <label>Bài dễ hơn (Regression)</label>
    <input id="e_regress" placeholder="VD: Goblet Box Squat">
    <label>Bài thay thế (Alternative)</label>
    <input id="e_alt" placeholder="VD: Hack Squat">
    <label>Ghi chú kỹ thuật</label>
    <textarea id="e_note"></textarea>
    <label>Link video hướng dẫn (nếu có)</label>
    <input id="e_video" type="url" placeholder="https://...">
    <div class="actions">
      <button type="button" class="danger" id="exDelete">Xóa</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="exCancel">Hủy</button>
      <button type="submit">Lưu</button>
    </div>
  </form>
</dialog>

<!-- Thêm bài vào buổi: nhóm cơ -> 1 ô gộp bài + biến thể -->
<dialog id="addDlg">
  <form id="addForm" method="dialog">
    <h2>Thêm bài tập vào buổi</h2>
    <label>Nhóm cơ</label>
    <select id="a_group"></select>
    <label>Bài tập / biến thể</label>
    <select id="a_ex"></select>
    <div class="actions">
      <button type="button" class="ghost" id="addCancel">Hủy</button>
      <button type="submit">Thêm</button>
    </div>
  </form>
</dialog>

<!-- Nhập từ Google Sheets -->
<dialog id="impDlg">
  <h2>Nhập khách từ Google Sheets</h2>
  <div class="muted">Cách 1: mở Sheets, bôi đen vùng gồm cả hàng tiêu đề, bấm Ctrl+C rồi dán vào ô dưới.<br>Cách 2: Tệp → Tải xuống → Giá trị phân tách bằng dấu phẩy (.csv), rồi chọn file.</div>
  <textarea id="imp_text" style="min-height:110px;margin-top:8px" placeholder="Dán dữ liệu vào đây..."></textarea>
  <div style="margin-top:8px"><input type="file" id="imp_file" accept=".csv,.tsv,.txt"></div>
  <div class="actions" style="justify-content:flex-start"><button type="button" id="imp_parse">Đọc dữ liệu</button></div>
  <div id="imp_map"></div>
  <div class="actions">
    <button type="button" class="ghost" id="imp_cancel">Đóng</button>
    <button type="button" id="imp_go" style="display:none">Nhập vào app</button>
  </div>
</dialog>

<script>
const KEY = "pt-app-data-v1";
let data = load();
let tab = "clients", editingId = null, curId = null, progWeek = 0, addToSession = null;
const openExtra = new Set();

// ---------- lưu trữ ----------
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.clients)) { d.exercises = d.exercises || []; d.schedule = d.schedule || []; return d; }
  } catch (e) {}
  return { clients: [], exercises: [], schedule: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch (e) { alert("Không lưu được dữ liệu trên trình duyệt này. Hãy dùng nút Sao lưu."); }
}

// ---------- tiện ích ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const fmtDate = s => { if (!s) return ""; const [y, m, d] = s.split("-"); return `${d}/${m}/${y}`; };
const dm = d => `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
const daysLeft = end => Math.round((parseYmd(end) - parseYmd(today())) / 86400000);
const DAYS = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];
const DAYNAMES = ["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7", "Chủ nhật"];
const dowIdx = d => (d.getDay() + 6) % 7;
const fmtTime = t => /^\d{2}:\d{2}$/.test(t || "") ? t.replace(":", "h") : (t || "");
function normTime(s) {
  s = String(s || "").trim().toLowerCase().replace("h", ":");
  if (!s) return "";
  const m = s.match(/^(\d{1,2})(?::?(\d{2}))?$/);
  if (!m) return s;
  const h = +m[1], mi = m[2] ? +m[2] : 0;
  if (h > 23 || mi > 59) return s;
  return String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0");
}
const shortSess = s => String(s.name || "").replace(/^buổi\s*/i, "").trim().slice(0, 4) || "?";
function weeklyText(c) {
  const w = c.weekly;

  const ds = [...w.days].sort((a, b) => a.d - b.d), times = new Set(ds.map(x => x.t || ""));
  if (times.size === 1) { const t = [...times][0]; return ds.map(x => DAYS[x.d]).join(" ") + (t ? " · " + fmtTime(t) : ""); }
  return ds.map(x => DAYS[x.d] + (x.t ? " " + fmtTime(x.t) : "")).join(" · ");
}
function doneCount(c) {
  return data.schedule.filter(s => s.clientId === c.id && s.status === "done" && (!c.pkg || !c.pkg.start || s.date >= c.pkg.start)).length;
}
function pkgBadge(p) {

}
function ensureProg(c) {
  if (!c.program) c.program = { name: "Chương trình tập", note: "", weeks: 4, sessions: [] };
  c.program.sessions.forEach(s => { if (!s.id) s.id = uid(); s.items = s.items || []; });
  if (!c.weekly) c.weekly = { days: [], time: "" };
  c.weekly.days.forEach(x => { if (x.t === undefined) x.t = c.weekly.time || ""; });

}

function renderProgTable() {
  const c = cur(), p = ensureProg(c), W = p.weeks, rows = [];
  p.sessions.forEach(s => s.items.forEach(it => {
    const ws = Array.from({ length: W }, (_, w) => (it.weights || [])[w]);
    const filled = ws.map(v => parseFloat(String(v ?? "").replace(",", "."))).filter(n => !isNaN(n));
    let d = "—";
    if (filled.length >= 2) {
      const diff = filled[filled.length - 1] - filled[0], pct = filled[0] ? diff / filled[0] * 100 : 0;
      const col = diff > 0 ? "var(--ok)" : diff < 0 ? "var(--bad)" : "var(--muted)";
      d = `<b style="color:${col}">${diff > 0 ? "+" : ""}${+diff.toFixed(2)} kg (${pct > 0 ? "+" : ""}${pct.toFixed(1)}%)</b>`;
    }
    rows.push(`<tr><td>${esc(s.name)}</td><td>${esc(it.label)}</td>${ws.map(v => `<td>${esc(v)}</td>`).join("")}<td>${d}</td></tr>`);
  }));
  const el = $("progTable"); if (!el) return;
  el.innerHTML = rows.length
    ? `<div style="overflow-x:auto"><table><tr><th>Buổi</th><th>Bài tập</th>${Array.from({ length: W }, (_, w) => `<th>T${w + 1}</th>`).join("")}<th>Thay đổi</th></tr>${rows.join("")}</table></div>`
    : `<div class="muted">Thêm bài tập và nhập mức tạ các tuần để xem tiến triển.</div>`;
}

const cv = $("view-client");
cv.addEventListener("input", e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  const c = cur(), p = ensureProg(c), s = t.dataset.s, i = t.dataset.i;
  if (f === "wtime") { const x = c.weekly.days.find(z => z.d === +t.dataset.d); if (x) x.t = t.value; save(); return; }
  if (f === "wsess") return;
  if (f === "pname") p.name = t.value;
  else if (i !== undefined) {
    const it = p.sessions[s].items[i];
    if (f === "w") { it.weights = it.weights || []; it.weights[progWeek] = t.value; renderProgTable(); }
    else it[f] = t.value;
  } else if (f === "name" && s !== undefined) p.sessions[s].name = t.value;
  save();
});
cv.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, s = +b.dataset.s, i = +b.dataset.i, c = cur(), p = ensureProg(c);
  if (act === "back") { setTab("clients"); render(); return; }
  if (act === "edit") return openForm(curId);
  if (act === "addItem") return openAdd(s);
  if (act === "toggleDay") {
    const d = +b.dataset.d, k = c.weekly.days.findIndex(z => z.d === d);
    if (k >= 0) c.weekly.days.splice(k, 1);
    else {
      const taken = new Set(c.weekly.days.map(z => z.s));
      let sess = p.sessions.find(z => !taken.has(z.id));
      if (!sess) { sess = { id: uid(), name: "Buổi " + String.fromCharCode(65 + p.sessions.length), items: [] }; p.sessions.push(sess); }
      const last = [...c.weekly.days].sort((a, b) => a.d - b.d).pop();
      c.weekly.days.push({ d, s: sess.id, t: last ? last.t : "" });
    }
  }
  else if (act === "week") progWeek = +b.dataset.w;
  else if (act === "weekAdd") p.weeks = Math.min(12, p.weeks + 1);
  else if (act === "weekSub") { if (!confirm(`Bớt Tuần ${p.weeks}? Mức tạ đã nhập ở tuần này vẫn được giữ trong file nhưng sẽ không hiển thị.`)) return; p.weeks = Math.max(1, p.weeks - 1); }
  else if (act === "addSession") p.sessions.push({ id: uid(), name: "Buổi " + String.fromCharCode(65 + p.sessions.length), items: [] });
  else if (act === "dupSession") {
    const copy = JSON.parse(JSON.stringify(p.sessions[s]));
    copy.id = uid(); copy.name += " (bản sao)"; copy.items.forEach(it => it.weights = []);
    p.sessions.splice(s + 1, 0, copy);
  }
  else if (act === "delSession") {
    if (!confirm(`Xóa "${p.sessions[s].name}" cùng toàn bộ bài tập và mức tạ trong buổi?`)) return;
    const id = p.sessions[s].id;
    c.weekly.days = c.weekly.days.filter(x => x.s !== id);
    p.sessions.splice(s, 1); openExtra.clear();
  }
  else if (act === "extra") { const k = `${s}:${i}`; openExtra.has(k) ? openExtra.delete(k) : openExtra.add(k); }
  else if (act === "delItem") { p.sessions[s].items.splice(i, 1); openExtra.clear(); }
  else if (act === "up" && i > 0) { const a = p.sessions[s].items; [a[i - 1], a[i]] = [a[i], a[i - 1]]; openExtra.clear(); }
  else if (act === "down") { const a = p.sessions[s].items; if (i < a.length - 1) { [a[i + 1], a[i]] = [a[i], a[i + 1]]; openExtra.clear(); } }
  else if (act === "checkin") {
    const d = $("ckDate").value; if (!d) return;
    if (data.schedule.some(x => x.clientId === c.id && x.date === d && x.status === "done")) { alert("Ngày này đã điểm danh rồi."); return; }
    data.schedule.push({ id: "s" + uid(), clientId: c.id, date: d, time: "", session: "", status: "done", note: "" });
  }
  else if (act === "ckDel") data.schedule = data.schedule.filter(x => x.id !== b.dataset.id);
  else return;
  save(); renderClient(); render();
});
cv.addEventListener("change", e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  const c = cur(), p = ensureProg(c), x = c.weekly.days.find(z => z.d === +t.dataset.d);
  if (f === "wtime" && x) {
    x.t = normTime(t.value); t.value = x.t;
    save(); render();
  } else if (f === "wsess" && x) {
    if (t.value === "__new") {
      const s = { id: uid(), name: "Buổi " + String.fromCharCode(65 + p.sessions.length), items: [] };
      p.sessions.push(s); x.s = s.id;
    } else x.s = t.value;
    save(); renderClient();
  }
});

// ---------- nhập khách từ Google Sheets ----------
function parseTable(text) {
  text = text.replace(/^﻿/, "");
  const first = text.split("\n")[0];
  const delim = first.includes("\t") ? "\t" : (first.split(";").length > first.split(",").length ? ";" : ",");
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); cur = ""; rows.push(row); row = []; }
    else cur += ch;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

let impRows = [];
function normDate(s) {
  s = (s || "").trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  return m ? `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}` : "";
}
const normNum = s => { const n = parseFloat(String(s || "").replace(/[^\d.,]/g, "").replace(/[.,](?=\d{3}\b)/g, "").replace(",", ".")); return isNaN(n) ? "" : n; };
function impParse() {
  impRows = parseTable($("imp_text").value);
  if (impRows.length < 2) { $("imp_map").innerHTML = `<div class="muted">Chưa đọc được dữ liệu. Cần ít nhất 1 hàng tiêu đề và 1 hàng khách.</div>`; $("imp_go").style.display = "none"; return; }
  const head = impRows[0].map(h => h.trim()), low = head.map(h => h.toLowerCase()), used = new Set();
  const opts = sel => `<option value="-1">— Bỏ qua —</option>` + head.map((h, i) => `<option value="${i}" ${i === sel ? "selected" : ""}>${esc(h || "(cột " + (i + 1) + ")")}</option>`).join("");
  $("imp_map").innerHTML = `<h3>Ghép cột (kiểm tra lại cho đúng)</h3>` + IMP_FIELDS.map(([k, label, keys]) => {
    let sel = -1;
    for (const kw of keys) { const i = low.findIndex((h, j) => !used.has(j) && h.includes(kw)); if (i >= 0) { sel = i; break; } }
    if (k === "name" && sel < 0) sel = low.findIndex(h => h === "tên");
    if (sel >= 0) used.add(sel);
    return `<label>${label}</label><select data-k="${k}">${opts(sel)}</select>`;
  }).join("") + `<div class="muted" style="margin-top:8px">Tìm thấy ${impRows.length - 1} dòng dữ liệu.</div>`;
  $("imp_go").style.display = "";
}

$("imp_go").onclick = () => {
  const map = {}; $("imp_map").querySelectorAll("select").forEach(s => map[s.dataset.k] = +s.value);
  if (map.name < 0) { alert("Hãy chọn cột Họ tên."); return; }
  const get = (r, k) => map[k] >= 0 ? (r[map[k]] || "").trim() : "";
  let added = 0, dup = 0;
  impRows.slice(1).forEach((r, i) => {
    const name = get(r, "name"); if (!name) return;
    const phone = get(r, "phone");
    if (data.clients.some(c => c.name.toLowerCase() === name.toLowerCase() && (c.phone || "") === phone)) { dup++; return; }
    data.clients.push({
      id: "c" + Date.now() + "_" + i, name, phone, dob: normDate(get(r, "dob")), goal: get(r, "goal"), health: get(r, "health"),
      pkg: { name: get(r, "pkgName"), total: normNum(get(r, "pkgTotal")), price: normNum(get(r, "pkgPrice")), start: normDate(get(r, "pkgStart")), end: normDate(get(r, "pkgEnd")), note: get(r, "pkgNote") }
    });
    added++;
  });
  save(); render(); $("impDlg").close();
  alert(`Đã nhập ${added} khách.${dup ? ` Bỏ qua ${dup} khách đã có (trùng tên và SĐT).` : ""}\nHãy mở vài khách để kiểm tra ngày tháng và số liệu.`);
};
